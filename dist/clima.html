<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="Cenário climático simulado para a chegada da viagem CyberBus a São Paulo.">
    <title>Clima na chegada — CyberBus</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css?v=20261023c">
    <link rel="stylesheet" href="css/responsive.css?v=20261023c">
  </head>
  <body class="app-page" data-page="clima" aria-busy="true">
    <a class="skip-link" href="#conteudo">Ir para o conteúdo</a>
    <div data-app-header></div>

    <main class="app-main container" id="conteudo">
      <nav class="breadcrumb" aria-label="Navegação estrutural"><a href="viagem.html?trip=BR1024&amp;v=20261023c">Minha viagem</a><span>/</span><span aria-current="page">Clima na chegada</span></nav>
      <header class="page-heading">
        <div>
          <p class="eyebrow">Planeje sua chegada</p>
          <h1>Clima no destino</h1>
          <p>Veja como pode estar o tempo em São Paulo no horário previsto da sua chegada.</p>
        </div>
        <span class="badge badge--neutral">Previsão simulada</span>
      </header>

      <div class="dashboard-layout weather-layout">

          <div class="section-heading">
            <div><p class="eyebrow">No horário da chegada</p><h2 id="forecast-heading">Condições no destino</h2></div>

          <div id="weather-forecast"></div>
          <div class="inline-alert inline-alert--info weather-note" id="weather-note"></div>

        <aside class="dashboard-aside weather-details" id="weather-details" aria-label="Data e local da chegada"></aside>
      </div>
    </main>

    <div data-app-footer></div>
    <div data-bottom-nav></div>
    <div data-more-sheet></div>
    <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>

    <script src="js/data.js"></script>
    <script src="js/app.js?v=20261023c"></script>
    <script src="js/simulation.js"></script>
    <script src="js/clima.js"></script>
