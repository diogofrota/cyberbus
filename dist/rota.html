<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="Mapa rodoviário real e acompanhamento simulado da rota Rio de Janeiro a São Paulo.">
    <title>Acompanhar viagem — CyberBus</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css?v=20261023d">
    <link rel="stylesheet" href="css/responsive.css?v=20261023d">
  </head>
  <body class="app-page" data-page="rota" aria-busy="true">
    <a class="skip-link" href="#conteudo">Ir para o conteúdo</a>
    <div data-app-header></div>

    <main class="app-main container" id="conteudo">
      <nav class="breadcrumb" aria-label="Navegação estrutural"><a href="viagem.html?trip=BR1024&amp;v=20261023d">Minha viagem</a><span>/</span><span aria-current="page">Acompanhar rota</span></nav>
      <header class="page-heading page-heading--route">
        <div>
          <p class="eyebrow">Acompanhamento da viagem</p>
          <h1>Seu ônibus está a caminho.</h1>
          <p>Acompanhe a posição simulada e as próximas etapas até São Paulo.</p>
        </div>
        <div class="status-cluster"><span class="badge badge--success"><i></i>Ônibus em movimento</span><span class="badge badge--neutral">Simulação acelerada</span></div>
      </header>

      <div class="route-layout">
        <section class="travel-map-card" aria-labelledby="travel-map-title">
          <div class="map-card__top"><div><span class="live-map-dot"></span><strong id="travel-map-title">Rio de Janeiro → São Paulo</strong></div><button class="map-control" type="button" id="recenter-bus" aria-label="Centralizar ônibus no mapa">Recentrar</button></div>
          <div class="travel-map travel-map--real" id="travel-map">
            <div class="real-map-canvas" id="route-leaflet-map" aria-label="Mapa interativo da rota rodoviária entre Rio de Janeiro e São Paulo"></div>
            <span class="real-map-chip real-map-chip--source">Trajeto rodoviário real</span>
            <span class="real-map-chip real-map-chip--simulation">GPS simulado</span>
          </div>
          <span class="sr-only" id="route-live-update" aria-live="polite" aria-atomic="true"></span>
        </section>

        <aside class="route-sidebar" id="route-sidebar" aria-label="Status atual da viagem"></aside>
      </div>
    </main>

    <div data-app-footer></div>
    <div data-bottom-nav></div>
    <div data-more-sheet></div>
    <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
    <script src="js/data.js"></script>
    <script src="js/app.js?v=20261023d"></script>
    <script src="js/simulation.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="js/real-map.js"></script>
    <script src="js/rota.js"></script>
  </body>
</html>
