<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="Acompanhamento simulado da rota Rio de Janeiro a São Paulo.">
    <title>Acompanhar viagem — CyberBus</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
  </head>
  <body class="app-page" data-page="rota" aria-busy="true">
    <a class="skip-link" href="#conteudo">Ir para o conteúdo</a>
    <div data-app-header></div>

    <main class="app-main container" id="conteudo">
      <nav class="breadcrumb" aria-label="Navegação estrutural"><a href="viagem.html?trip=BR1024">Minha viagem</a><span>/</span><span aria-current="page">Acompanhar rota</span></nav>
      <header class="page-heading page-heading--route">
        <div>
          <p class="eyebrow">Acompanhamento da viagem</p>
          <h1>Seu ônibus está a caminho.</h1>
          <p>Acompanhe a posição simulada e as próximas etapas até São Paulo.</p>
        </div>
        <div class="status-cluster"><span class="badge badge--success"><i></i>Ônibus em movimento</span><span class="badge badge--neutral">Simulação acelerada</span></div>
      </header>

      <div class="route-layout">
        <section class="travel-map-card" aria-labelledby="travel-map-title">
          <div class="map-card__top"><div><span class="live-map-dot"></span><strong id="travel-map-title">Rio de Janeiro → São Paulo</strong></div><button class="map-control" type="button" id="recenter-bus" aria-label="Centralizar ônibus no mapa">Recentrar</button></div>
          <div class="travel-map" id="travel-map">
            <div class="travel-map__terrain" aria-hidden="true"></div>
            <svg class="travel-map__routes" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
              <path class="travel-map__route-base" pathLength="100" d="M6 78 C15 69 21 73 31 62 S49 51 57 48 S68 37 75 34 S87 20 94 16"></path>
              <path class="travel-map__route-done" pathLength="100" d="M6 78 C15 69 21 73 31 62 S49 51 57 48 S68 37 75 34 S87 20 94 16"></path>
            </svg>
            <div class="travel-map__labels" id="map-stops" aria-hidden="true"></div>
            <div class="bus-marker" id="bus-marker" aria-label="Localização atual simulada do ônibus"></div>
            <div class="map-compass" aria-hidden="true"><span>N</span><i></i></div>
            <div class="map-attribution">Mapa ilustrativo · localização simulada</div>
          </div>
        </section>

        <aside class="route-sidebar" id="route-sidebar" aria-label="Status atual da viagem"></aside>
      </div>
    </main>

    <div data-app-footer></div>
    <div data-bottom-nav></div>
    <div data-more-sheet></div>
    <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/simulation.js"></script>
    <script src="js/rota.js"></script>
  </body>
</html>
